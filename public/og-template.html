<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #faf8f4;
        color: #1b1815;
        font-family: "IBM Plex Sans", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px;
        border: 1px solid #e3ddd2;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: "IBM Plex Mono", monospace;
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6e675e;
      }
      .top .accent {
        color: #c2410c;
      }
      .middle {
        margin-top: -40px;
      }
      h1 {
        font-family: "IBM Plex Serif", serif;
        font-weight: 500;
        font-size: 128px;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .title {
        margin-top: 28px;
        font-size: 34px;
        color: #6e675e;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-top: 1px solid #e3ddd2;
        padding-top: 32px;
      }
      .stack {
        font-family: "IBM Plex Serif", serif;
        font-size: 28px;
      }
      .stack .dot {
        color: #c2410c;
        margin: 0 10px;
      }
      .url {
        font-family: "IBM Plex Mono", monospace;
        font-size: 20px;
        color: #6e675e;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span>Full Stack Developer</span>
      <span class="accent">isakli.uk</span>
    </div>
    <div class="middle">
      <h1>İsa Kaya</h1>
      <p class="title">Web applications, SaaS products and operational software.</p>
    </div>
    <div class="bottom">
      <p class="stack">
        React<span class="dot">·</span>Next.js<span class="dot">·</span>Node.js<span class="dot">·</span>PostgreSQL
      </p>
      <p class="url">İstanbul, Türkiye</p>
    </div>
  </body>
</html>
